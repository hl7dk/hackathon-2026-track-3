services:
  # Local HAPI servers, opt-in: docker compose --profile local up -d
  # The app uses the shared datasource servers by default (frontend/config.yml).
  hapi-dk:
    image: hapiproject/hapi:v8.12.0-1
    ports:
      - "28080:8080"
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/configs/dk.yaml
    volumes:
      - ./hapi/dk.yaml:/configs/dk.yaml:ro
    profiles: ["local"]

  hapi-de-hospital:
    image: hapiproject/hapi:v8.12.0-1
    ports:
      - "28081:8080"
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/configs/de-hospital.yaml
    volumes:
      - ./hapi/de-hospital.yaml:/configs/de-hospital.yaml:ro
    profiles: ["local"]

  hapi-de-gp:
    image: hapiproject/hapi:v8.12.0-1
    ports:
      - "28082:8080"
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/configs/de-gp.yaml
    volumes:
      - ./hapi/de-gp.yaml:/configs/de-gp.yaml:ro
    profiles: ["local"]

  # Matchbox (HAPI-based): StructureMap/$transform with the DK -> DE maps in maps/ and the ConceptMaps
  # from terminology/, used by Convert in the frontend. docker compose up -d matchbox, then maps/load.sh.
  # Data is lost when the container is recreated.
  matchbox:
    image: europe-west6-docker.pkg.dev/ahdis-ch/ahdis/matchbox:latest
    ports:
      - "28084:8080"
    volumes:
      - ./matchbox:/config:ro
    mem_limit: 4g
    profiles: ["local", "terminology"]

  # walt.id identity stack for the wallet (wallet.mode: waltid in frontend/config.yml):
  # docker compose --profile wallet up -d. Configs in ./waltid, everything in memory.
  # The services reach each other by service name (offer and request URLs use them),
  # the dev server uses the published ports.
  waltid-issuer:
    image: waltid/issuer-api2:1.1.1
    ports:
      - "28095:7005"
    volumes:
      - ./waltid/issuer/config:/waltid-issuer-api2/config:ro
    profiles: ["wallet"]

  waltid-verifier:
    image: waltid/verifier-api2:1.1.1
    ports:
      - "28096:7004"
    volumes:
      - ./waltid/verifier/config:/waltid-verifier-api2/config:ro
    profiles: ["wallet"]

  waltid-wallet:
    image: waltid/wallet-api2:latest
    ports:
      - "28097:7006"
    volumes:
      - ./waltid/wallet/config:/waltid-wallet-api2/config:ro
    profiles: ["wallet"]

  # walt.id's web wallet (the wallet-api2 one): log in with a test user's wallet account to see
  # the key and PID. It runs in the browser and calls the wallet API at its published port.
  waltid-web-wallet:
    image: waltid/wallet-demo-compose-web:latest
    ports:
      - "28098:8080"
    environment:
      WALLET_API2_PUBLIC_URL: http://localhost:28097
      WALLET_BRAND_APP_TITLE: Patient wallet
    depends_on:
      - waltid-wallet
    profiles: ["wallet"]

  # Two validators because hospital and GP use different de.basisprofil.r4 versions
  validator-hospital:
    build:
      context: ./validator
      args:
        IGS: >-
          hl7.fhir.dk.core#3.7.0
          de.basisprofil.r4#1.5.2
          de.gematik.isik-basismodul#4.0.3
          de.medizininformatikinitiative.kerndatensatz.person#2025.0.1
          de.medizininformatikinitiative.kerndatensatz.diagnose#2025.0.1
          de.medizininformatikinitiative.kerndatensatz.medikation#2026.0.1
          de.medizininformatikinitiative.kerndatensatz.laborbefund#2026.0.3
          de.medizininformatikinitiative.kerndatensatz.consent#2026.0.0
    image: dkde-validator-hospital
    volumes: &validator-volumes
      - ./data:/data
    environment:
      REPORT_NAME: hospital
      INPUTS:
      TX_SERVER: ${TX_SERVER:-https://tx.fhir.org}
    profiles: ["tools"]

  validator-gp:
    build:
      context: ./validator
      args:
        IGS: >-
          hl7.fhir.dk.core#3.7.0
          de.basisprofil.r4#1.5.4
          kbv.basis#1.9.0
          de.gematik.epa.medication#1.3.5
    image: dkde-validator-gp
    volumes: *validator-volumes
    environment:
      REPORT_NAME: gp
      INPUTS:
      TX_SERVER: ${TX_SERVER:-https://tx.fhir.org}
    profiles: ["tools"]
