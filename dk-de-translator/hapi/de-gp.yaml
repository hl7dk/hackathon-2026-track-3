hapi:
  fhir:
    fhir_version: R4
    # STORE_ONLY because KBV Basis references base profiles as e.g. |1.5,
    # which HAPI can't resolve against 1.5.4 (HAPI-0705)
    implementationguides:
      basisprofil:
        name: de.basisprofil.r4
        version: 1.5.4
        packageUrl: https://packages.fhir.org/de.basisprofil.r4/1.5.4
        installMode: STORE_ONLY
      kbv_basis:
        name: kbv.basis
        version: 1.9.0
        packageUrl: https://packages.fhir.org/kbv.basis/1.9.0
        installMode: STORE_ONLY
      epa_medication:
        name: de.gematik.epa.medication
        version: 1.3.5
        packageUrl: https://packages.fhir.org/de.gematik.epa.medication/1.3.5
        installMode: STORE_ONLY
    tester:
      home:
        name: DE GP (KBV, ePA medication)
        server_address: http://localhost:8082/fhir
