# Front end configuration. `npm run dev` restarts itself when this file changes.
#
# Each server has a url the page calls. With proxyTo set, `npm run dev` forwards
# that path to the real server, so CORS does not come into play. auth: basic makes
# the proxy log in with USERNAME/PASSWORD from ../.env (they never reach the browser).
# The shared servers are datasource1..4.hl7-your-health.projects.alexandrainst.dk.
# For the local containers (docker compose --profile local up -d), use
# proxyTo http://localhost:28080/fhir (dk), 28081 (de-hospital), 28082 (de-gp) and drop auth.

# Who can sign in with the demo MitID issuer. The identity credential it issues proves
# the CPR; the verifier only returns that patient's record. These are the Danish test
# patients in ../data/in.
testUsers:
  - { id: anne, given: Anne, family: Sørensen, birthDate: "1985-09-11", login: MitID test user A.Sorensen, cpr: "1109859996" }
  - { id: emma, given: Emma, family: Nielsen, birthDate: "2017-03-14", login: MitID test user E.Nielsen, cpr: "1403174012" }
  - { id: mette, given: Mette, family: Hansen, birthDate: "1971-08-22", login: MitID test user M.Hansen, cpr: "2208712468" }

wallet:
  # waltid: walt.id issuer, wallet and verifier (docker compose --profile wallet, see ../waltid).
  #   Sign-in issues an EUDI PID (SD-JWT VC) into a walt.id wallet; the source asks for the CPR over OpenID4VP.
  # demo: a JWT signed by the dev server itself (server/demo), held by the browser. No extra services.
  mode: waltid
  ttlMinutes: 15 # demo mode: how long a credential is valid
  waltid:
    issuer: http://localhost:28095
    verifier: http://localhost:28096
    wallet: http://localhost:28097
    webWallet: http://localhost:28098 # walt.id's web wallet, "Open my wallet"
    # Each test user's wallet account is <id>@wallet.demo with this password (local, in-memory demo accounts).
    accountPassword: local-demo-wallet
    profileId: dkPid # issuer profile, waltid/issuer/config/issuer2-profiles.conf
    credentialType: urn:eudi:pid:1 # the vct the verifier asks for

cprSystem: urn:oid:1.2.208.176.1.2

# Where a patient's data can be requested from.
# profiles is empty: resources are validated against their own meta.profile.
# allowDelete: the dashboard (patients.html) can delete patients and single resources here.
sources:
  - id: dk
    label: Danish GP (DK-Core)
    url: /datasource1/fhir
    proxyTo: https://datasource1.hl7-your-health.projects.alexandrainst.dk/fhir
    auth: basic
    allowDelete: true
    profiles: {}

# Where converted data can be sent, and what each resource type is validated
# against there (same mapping as the CLI validators, see ../README.md). map: the StructureMap
# Convert runs for this target. allowDelete: the dashboard (patients.html) can delete patients and single resources here.
# The German targets are the shared servers datasource2 (hospital) and datasource3 (GP).
# For the local containers instead (../dev.sh): /local-de-hospital/fhir and /local-de-gp/fhir,
# proxyTo http://localhost:28081/fhir and 28082, without auth.
targets:
  - id: de-hospital
    label: German hospital (ISiK / MII)
    url: /datasource2/fhir
    proxyTo: https://datasource2.hl7-your-health.projects.alexandrainst.dk/fhir
    auth: basic
    map: https://hl7-your-health.projects.alexandrainst.dk/fhir/StructureMap/dk-to-isik
    allowDelete: true
    profiles:
      Patient: https://gematik.de/fhir/isik/StructureDefinition/ISiKPatient
      Condition: https://gematik.de/fhir/isik/StructureDefinition/ISiKDiagnose
      MedicationStatement: https://www.medizininformatik-initiative.de/fhir/core/modul-medikation/StructureDefinition/MedicationStatement
      AllergyIntolerance: https://gematik.de/fhir/isik/StructureDefinition/ISiKAllergieUnvertraeglichkeit
      # Vital signs, by LOINC code: the de.basisprofil ones (ISiK keeps its own in a module the server does not have)
      Observation:
        85354-9: http://fhir.de/StructureDefinition/observation-de-vitalsign-blutdruck
        8867-4: http://fhir.de/StructureDefinition/observation-de-vitalsign-herzfrequenz
        2708-6: http://fhir.de/StructureDefinition/observation-de-vitalsign-sauerstoffsaettigung-pulsoximetrie

  - id: de-gp
    label: German GP in Flensburg (KBV)
    url: /datasource3/fhir
    proxyTo: https://datasource3.hl7-your-health.projects.alexandrainst.dk/fhir
    auth: basic
    map: https://hl7-your-health.projects.alexandrainst.dk/fhir/StructureMap/dk-to-kbv
    allowDelete: true
    profiles:
      Patient: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Patient
      Condition: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Condition_Diagnosis
      MedicationStatement: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_MedicationStatement
      AllergyIntolerance: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_AllergyIntolerance
      # Vital signs, by LOINC code
      Observation:
        85354-9: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Observation_Blood_Pressure
        8867-4: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Observation_Heart_Rate
        2708-6: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Observation_Peripheral_Oxygen_Saturation

# Matchbox, holding the StructureMaps from ../maps/ and the ConceptMaps from ../terminology/ (load both with
# ../maps/load.sh <base>). Convert runs StructureMap/$transform there with the target's map.
# The shared one on datasource4. For the local container (docker compose up -d matchbox) instead:
# url /local-matchbox/fhir, proxyTo http://localhost:28084/matchboxv3/fhir, no auth.
transform:
  id: matchbox
  url: /datasource4/matchboxv3/fhir
  proxyTo: https://datasource4.hl7-your-health.projects.alexandrainst.dk/matchboxv3/fhir
  auth: basic
  # Danish code system: the German one the maps add next to it. Only used to report what was translated.
  systems:
    urn:oid:1.2.208.176.2.4.12: http://fhir.de/CodeSystem/bfarm/icd-10-gm
    urn:oid:1.2.208.176.2.31: http://fhir.de/CodeSystem/bfarm/icd-10-gm
    http://www.whocc.no/atc: http://fhir.de/CodeSystem/bfarm/atc

# Resource types the patient can choose to share. Patient is always included.
scopes:
  - { type: Patient, label: Personal details }
  - { type: Condition, label: Diagnoses }
  - { type: MedicationStatement, label: Medication }
  - { type: AllergyIntolerance, label: Allergies }
  - { type: Observation, label: Measurements }

# Purposes offered when sharing.
purposes:
  - Treatment by this provider
  - Second opinion
  - Research (data donation)

# Short names for code systems shown in the tables.
systemLabels:
  urn:oid:1.2.208.176.1.2: CPR
  urn:oid:1.2.208.176.2.4.12: SKS
  urn:oid:1.2.208.176.2.31: ICPC-2
  http://www.whocc.no/atc: ATC
  http://snomed.info/sct: SNOMED CT
  http://loinc.org: LOINC
  http://fhir.de/sid/gkv/kvid-10: KVNR
  http://fhir.de/CodeSystem/bfarm/icd-10-gm: ICD-10-GM
  http://fhir.de/CodeSystem/ifa/pzn: PZN
  http://fhir.de/CodeSystem/bfarm/atc: ATC (BfArM)
