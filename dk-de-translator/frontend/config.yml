# Front end configuration. Restart `npm run dev` after editing.
#
# Each server has a url the page calls. With proxyTo set, `npm run dev` forwards
# that path to the real server (ports from ../docker-compose.yml), so the page shows
# readable paths named after the containers and CORS does not come into play.
# For a remote server, put its full https URL in url and leave out proxyTo.

# Who the placeholder sign-in logs in.
patient:
  name: Anne Sørensen
  login: MitID test user A.Sorensen
  cpr: "1109859996"

cprSystem: urn:oid:1.2.208.176.1.2

# Where a patient's data can be requested from.
# profiles is empty: resources are validated against their own meta.profile.
sources:
  - id: dk
    label: Danish GP (DK-Core)
    url: /hapi-dk/fhir
    proxyTo: http://localhost:28080/fhir
    profiles: {}

# Where converted data can be sent, and what each resource type is validated
# against there (same mapping as the CLI validators, see ../README.md).
targets:
  - id: de-hospital
    label: German hospital (ISiK / MII)
    url: /hapi-de-hospital/fhir
    proxyTo: http://localhost:28081/fhir
    profiles:
      Patient: https://gematik.de/fhir/isik/StructureDefinition/ISiKPatient
      Condition: https://gematik.de/fhir/isik/StructureDefinition/ISiKDiagnose
      MedicationStatement: https://www.medizininformatik-initiative.de/fhir/core/modul-medikation/StructureDefinition/MedicationStatement
      AllergyIntolerance: https://gematik.de/fhir/isik/StructureDefinition/ISiKAllergieUnvertraeglichkeit

  - id: de-gp
    label: German GP in Flensburg (KBV)
    url: /hapi-de-gp/fhir
    proxyTo: http://localhost:28082/fhir
    profiles:
      Patient: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Patient
      Condition: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_Condition_Diagnosis
      MedicationStatement: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_MedicationStatement
      AllergyIntolerance: https://fhir.kbv.de/StructureDefinition/KBV_PR_Base_AllergyIntolerance

# Resource types the patient can choose to share. Patient is always included.
scopes:
  - { type: Patient, label: Personal details }
  - { type: Condition, label: Diagnoses }
  - { type: MedicationStatement, label: Medication }
  - { type: AllergyIntolerance, label: Allergies }
  - { type: Observation, label: Measurements }

# Purposes offered when sharing.
purposes:
  - Treatment by this provider
  - Second opinion
  - Research (data donation)

# Short names for code systems shown in the tables.
systemLabels:
  urn:oid:1.2.208.176.1.2: CPR
  urn:oid:1.2.208.176.2.4.12: SKS
  urn:oid:1.2.208.176.2.31: ICPC-2
  http://www.whocc.no/atc: ATC
  http://snomed.info/sct: SNOMED CT
  http://loinc.org: LOINC
  http://fhir.de/sid/gkv/kvid-10: KVNR
  http://fhir.de/CodeSystem/bfarm/icd-10-gm: ICD-10-GM
  http://fhir.de/CodeSystem/ifa/pzn: PZN
