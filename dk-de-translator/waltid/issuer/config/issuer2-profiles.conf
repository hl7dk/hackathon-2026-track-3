# One profile: a Danish PID (EUDI PID as SD-JWT VC) with the CPR number as
# personal_administrative_number. The dev server fills in the person per offer
# (runtimeOverrides.credentialData, merged over the values below), see frontend/server/waltid/.
profiles = {
  dkPid = {
    name = "Danish PID (SD-JWT VC)"
    credentialConfigurationId = "urn:eudi:pid:1"
    issuerKey = ${defaultIssuerKey}
    credentialData = {
      "family_name" = ""
      "given_name" = ""
      "birth_date" = ""
      "nationality" = ["DK"]
      "personal_administrative_number" = ""
      "issuing_country" = "DK"
      "issuing_authority" = "Demo MitID issuer"
    }
    mapping = {
      id = "<uuid>"
      iat = "<timestamp-seconds>"
      nbf = "<timestamp-seconds>"
      exp = "<timestamp-in-seconds:365d>"
    }
    # Every claim can be left out of a presentation, so a verifier asking for the CPR gets only the CPR.
    selectiveDisclosure = {
      "fields" = {
        "family_name" = { "sd" = true }
        "given_name" = { "sd" = true }
        "birth_date" = { "sd" = true }
        "nationality" = { "sd" = true }
        "personal_administrative_number" = { "sd" = true }
      }
      "decoyMode" = "NONE"
      "decoys" = 0
    }
    x5Chain = ${defaultIssuerX5chain}
  }
}
