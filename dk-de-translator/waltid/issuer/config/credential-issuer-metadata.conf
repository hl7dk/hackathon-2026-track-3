# Trimmed from walt.id's docker-compose/issuer-api2/config/credential-issuer-metadata.conf (Apache-2.0, see waltid/NOTICE).
issuerDisplay = [
  { name = "Demo MitID issuer", locale = "en" }
]

credentialConfigurations = {
  "urn:eudi:pid:1" = {
    format = "dc+sd-jwt"
    scope = "urn:eudi:pid:1"
    # The EUDI PID type, published as is (walt.id's "vctBaseUrl" would make it depend on the issuer's host).
    vct = "urn:eudi:pid:1"
    credential_signing_alg_values_supported = ["ES256"]
    cryptographic_binding_methods_supported = ["jwk", "did:key", "did:jwk"]
    proof_types_supported = {
      jwt = {
        proof_signing_alg_values_supported = ["ES256", "EdDSA"]
      }
    }
    credential_metadata = {
      display = [
        { name = "Danish PID", locale = "en", description = "Person identification data" }
      ]
      claims = [
        { path = ["family_name"], display = [{ name = "Family name", locale = "en" }] },
        { path = ["given_name"], display = [{ name = "Given name", locale = "en" }] },
        { path = ["birth_date"], display = [{ name = "Date of birth", locale = "en" }] },
        { path = ["nationality"], display = [{ name = "Nationality", locale = "en" }] },
        { path = ["personal_administrative_number"], display = [{ name = "CPR number", locale = "en" }] },
        { path = ["issuing_country"], display = [{ name = "Issuing country", locale = "en" }] },
        { path = ["issuing_authority"], display = [{ name = "Issuing authority", locale = "en" }] }
      ]
    }
  }
}
