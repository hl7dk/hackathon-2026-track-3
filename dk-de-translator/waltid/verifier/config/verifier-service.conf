# Based on walt.id's docker-compose/verifier-api2/config/verifier-service.conf (Apache-2.0, see waltid/NOTICE).
# Without clientId, requests are unsigned and the client_id is redirect_uri:<response_uri>.
clientMetadata: {
  client_name: "Danish GP (DK-Core)"
}
# Where the wallet sends its presentation: the verifier's Docker service name.
urlPrefix: "http://waltid-verifier:7004/verification-session"
urlHost: "openid4vp://authorize"
